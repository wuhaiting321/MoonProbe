name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-and-test:
    name: moon check / moon test (wasm-gc)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show the toolchain version
        run: moon version --all

      - name: Check every package
        run: moon check --target wasm-gc

      - name: Run the unit tests
        run: moon test --target wasm-gc

      - name: Build the whole module
        run: moon build --target wasm-gc