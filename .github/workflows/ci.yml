name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-and-test:
    name: moon check / test / build (wasm-gc + js)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show the toolchain version
        run: moon version --all

      - name: Check every package on the wasm-gc target
        run: moon check --target wasm-gc

      - name: Run the unit tests on the wasm-gc target
        run: moon test --target wasm-gc

      - name: Build the whole module on the wasm-gc target
        run: moon build --target wasm-gc

      - name: Check every package on the js target
        run: moon check --target js

      - name: Build the whole module on the js target
        run: moon build --target js